name: List Restaurants\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{uri}}/restaurants?page=0&size=10&sort=name,asc'\n          params:\n            - name: page\n              value: '0'\n              type: query\n            - name: size\n              value: '10'\n              type: query\n            - name: sort\n              value: name,asc\n              type: query\n            - name: name\n              value: ''\n              type: query\n              disabled: true\n            - name: city\n              value: ''\n              type: query\n              disabled: true\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Publico. Solo devuelve restaurantes con active = true. Los restaurantes\n          creados desde el flujo de proponer francesinha nacen inactivos y solo\n          aparecen aqui cuando un admin aprueba alguna de sus francesinhas.\n      - info:\n          name: Get Restaurant\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{uri}}/restaurants/1'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n  - info:\n      name: Actuator\n      type: folder\n      seq: 6\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: health\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{uri}}/actuator/health'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n      - info:\n          name: metrics\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{uri}}/actuator/metrics/jvm.memory.used'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n  - info:\n      name: Favorites\n      type: folder\n      seq: 5\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Check Favorite\n          type: http\n          seq: 3\n        http:\n          method: GET\n          url: '{{uri}}/favorites/36'\n          headers:\n            - name: Authorization\n              value: Bearer {{authToken}}\n              disabled: true\n          auth: inherit\n        settings:\n          encodeUrl: false\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: 'Solo USER. Devuelve { \"isFavorite\": true | false } para una francesinha concreta.'\n      - info:\n          name: List Favorites\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{uri}}/favorites?page=0&size=200&sort=createdAt,desc'\n          headers:\n            - name: Authorization\n              value: Bearer {{authToken}}\n              disabled: true\n          params:\n            - name: page\n              value: '0'\n              type: query\n            - name: size\n              value: '200'\n              type: query\n            - name: sort\n              value: createdAt,desc\n              type: query\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Solo USER. Lista los favoritos del usuario autenticado, paginados.\n          El frontend pide size=200 al cargar para tener todos los IDs en memoria y pintar el corazon.\n      - info:\n          name: Toggle Favorite\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: '{{uri}}/favorites/36'\n          headers:\n            - name: Authorization\n              value: Bearer {{authToken}}\n              disabled: true\n          auth: inherit\n        settings:\n          encodeUrl: false\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Solo USER. Toggle: si la francesinha no es favorita la a\xF1ade, si ya lo es la borra.\n          La URL termina en el id de la francesinha (no del favorito).\n  - info:\n      name: Reviews\n      type: folder\n      seq: 4\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: List Reviews\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{uri}}/francesinhas/1/reviews?page=0&size=10&sort=createdAt,desc'\n          params:\n            - name: page\n              value: '0'\n              type: query\n            - name: size\n              value: '10'\n              type: query\n            - name: sort\n              value: createdAt,desc\n              type: query\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Lista paginada de reviews. Solo funciona con francesinhas en estado ACCEPTED.\n          Para reviews de PENDING usar el endpoint admin /francesinhas/pending/{id}/reviews.\n  - info:\n      name: Francesinhas\n      type: folder\n      seq: 2\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Get Francesinha\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{uri}}/francesinhas/1'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: Devuelve solo francesinhas en estado ACCEPTED. Para ver una PENDING usar el endpoint admin /pending/{id}.\n      - info:\n          name: List Francesinhas\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{uri}}/francesinhas?page=0&size=10&sort=createdAt,desc'\n          params:\n            - name: page\n              value: '0'\n              type: query\n            - name: size\n              value: '10'\n              type: query\n            - name: sort\n              value: createdAt,desc\n              type: query\n            - name: name\n              value: ''\n              type: query\n              disabled: true\n            - name: city\n              value: ''\n              type: query\n              disabled: true\n            - name: type\n              value: ''\n              type: query\n              disabled: true\n            - name: restaurantId\n              value: ''\n              type: query\n              disabled: true\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Lista francesinhas en estado ACCEPTED.\n          Filtros opcionales: name (like), city (like), type (CLASICA|ESPECIAL|VEGANA|KEBAB|MARISCO), restaurantId (exacto).\n          Para activar un filtro, quitar la tilde (~) delante.\n      - info:\n          name: Admin\n          type: folder\n          seq: 4\n        request:\n          auth: inherit\n        items:\n          - info:\n              name: Get Pending\n              type: http\n              seq: 2\n            http:\n              method: GET\n              url: '{{uri}}/francesinhas/pending/1'\n              headers:\n                - name: Authorization\n                  value: Bearer {{authToken}}\n                  disabled: true\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: |-\n              Solo ADMIN. Devuelve el detalle de una francesinha sin filtrar por estado\n              (pensado para ver propuestas en estado PENDING).\n          - info:\n              name: Get Stats\n              type: http\n              seq: 4\n            http:\n              method: GET\n              url: '{{uri}}/francesinhas/stats'\n              headers:\n                - name: Authorization\n                  value: Bearer {{authToken}}\n                  disabled: true\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: Solo ADMIN. Devuelve { pending, accepted, rejected, total } para las cards del dashboard.\n          - info:\n              name: List Pending Reviews\n              type: http\n              seq: 5\n            http:\n              method: GET\n              url: '{{uri}}/francesinhas/pending/1/reviews'\n              headers:\n                - name: Authorization\n                  value: Bearer {{authToken}}\n                  disabled: true\n              params:\n                - name: page\n                  value: '0'\n                  type: query\n                - name: size\n                  value: '10'\n                  type: query\n                - name: sort\n                  value: createdAt,desc\n                  type: query\n              auth: inherit\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: |-\n              Solo ADMIN. Igual que /francesinhas/{id}/reviews pero sin filtrar por estado de la francesinha.\n              Lo usa el detalle del admin para ver la review que dejo el proponente con la propuesta (PENDING).\n          - info:\n              name: List Pending\n              type: http\n              seq: 1\n            http:\n              method: GET\n              url: '{{uri}}/francesinhas/pending'\n              params:\n                - name: page\n                  value: '0'\n                  type: query\n                - name: size\n                  value: '10'\n                  type: query\n                - name: sort\n                  value: createdAt,asc\n                  type: query\n              auth:\n                type: bearer\n                token: '{{authToken}}'\n            settings:\n              encodeUrl: true\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: |-\n              Solo ADMIN. Lista las francesinhas en estado PENDING ordenadas por antiguedad ASC.\n              El frontend pide size=50 desde el dashboard para mostrar todas en la lista de moderacion.\n          - info:\n              name: Update Status\n              type: http\n              seq: 3\n            http:\n              method: PATCH\n              url: '{{uri}}/francesinhas/pending/1/status'\n              headers:\n                - name: Content-Type\n                  value: application/json\n              body:\n                type: json\n                data: |-\n                  {\n                    \"status\": \"ACCEPTED\"\n                  }\n              auth: inherit\n            settings:\n              encodeUrl: false\n              timeout: 0\n              followRedirects: true\n              maxRedirects: 5\n            docs: |-\n              Solo ADMIN. Cambia el estado de una francesinha PENDING a ACCEPTED o REJECTED.\n              PENDING en el body devuelve 400. La francesinha no puede salir de ACCEPTED/REJECTED a otro estado.\n\n              Efecto colateral: si el estado pasa a ACCEPTED y el restaurante asociado todavia\n              esta inactivo (caso del flujo \"proponer con restaurante nuevo\"), el restaurante\n              se activa automaticamente y empieza a aparecer en GET /restaurants.\n  - info:\n      name: Login\n      type: folder\n    request:\n      auth: inherit\n    docs:\n      content: |-\n        usuario: \n\n        // rol -> admin\n        {\n          \"email\": \"admin@francesinhas.com\",\n          \"password\": \"admin1234\"\n        }\n\n\n        //rol -> USER\n        {\n          \"email\": \"test@test.com\",\n          \"password\": \"testtest\"\n        }\n      type: text/markdown\n    items:\n      - info:\n          name: Login - ERROR\n          type: http\n          seq: 5\n        http:\n          method: POST\n          url: '{{uri}}/auth/login'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"email\": \"admin@francesinh.com\",\n                \"password\": \"admin\"\n              }\n          auth: inherit\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                const body = res.getBody();\n                bru.setEnvVar(\"authToken\", body.accessToken);\n                bru.setEnvVar(\"refreshToken\", body.refreshToken);\n        settings:\n          encodeUrl: false\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n      - info:\n          name: Login Admin\n          type: http\n          seq: 6\n        http:\n          method: POST\n          url: '{{uri}}/auth/login'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |+\n              {\n                \"email\": \"admin@francesinhas.com\",\n                \"password\": \"admin1234\"\n              }\n\n\n          auth: inherit\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                const body = res.getBody();\n                bru.setEnvVar(\"authToken\", body.accessToken);\n                bru.setEnvVar(\"refreshToken\", body.refreshToken);\n        settings:\n          encodeUrl: false ettings:\n          encodeUrl: false\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n      - info:\n          name: SignUp\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: '{{uri}}/auth/signup'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              { \"name\": \"alex\",\n               \n                \"email\": \"aramosda@uoc.edu\",\n                \"password\": \"Fodase!1\"\n               \n              }\n          auth: inherit\n        runtime:\n          scripts:\n            - type: after-response\n              code: |-\n                const body = res.getBody();\n                bru.setEnvVar(\"authToken\", body.accessToken);\n                bru.setEnvVar(\"refreshToken\", body.refreshToken);\n        settings:\n          encodeUrl: false\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    presets:\n      requestType: http\n    exportedAt: '2026-04-25T19:30:03.899Z'\n    exportedUsing: Bruno/3.3.0\n";
